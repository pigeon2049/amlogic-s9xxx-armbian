# Scope the tested PCM format to this board's HDMI sink, not USB/Bluetooth.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__HDMI__sink" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        node.description = "W103D HDMI"
        priority.session = 1200
      }
    }
  }
]
